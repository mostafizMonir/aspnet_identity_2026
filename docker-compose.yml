services:
  aspnetidentity2026.api:
    image: ${DOCKER_REGISTRY-}aspnetidentity2026api
    build:
      context: .
      dockerfile: src/AspNetIdentity2026.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
    # Fixed host port so the API is always at http://localhost:8080. Override with
    # API_PORT in .env if 8080 is taken. No HTTPS port: the container serves plain
    # HTTP and TLS terminates at the reverse proxy / ingress in front of it.
    ports:
      - "${API_PORT:-8080}:8080"
